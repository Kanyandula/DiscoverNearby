name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # compileSdk and the android.car.jar compileOnly path both come from compileApi in app/build.gradle.kts.
      - name: Install Android SDK platform
        run: |
          api=$(sed -n 's/^val compileApi = \([0-9][0-9]*\)$/\1/p' app/build.gradle.kts)
          test -n "$api" || { echo "compileApi not found in app/build.gradle.kts"; exit 1; }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$api.0" > /dev/null

      - name: Detekt, unit tests, debug build
        run: ./gradlew detekt testDebugUnitTest assembleDebug --console=plain
