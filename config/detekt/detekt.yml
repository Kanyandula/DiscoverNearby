# Overrides on top of detekt's defaults (buildUponDefaultConfig); maxIssues stays at its default of 0.
naming:
  FunctionNaming:
    # Composable functions are PascalCase by convention.
    ignoreAnnotated:
      - "Composable"

style:
  MagicNumber:
    # Named property declarations (colours, dimensions) are the fix MagicNumber asks for.
    ignorePropertyDeclaration: true

complexity:
  LongParameterList:
    # Defaulted parameters (Compose's `modifier`) add nothing a caller must pass.
    ignoreDefaultParameters: true
